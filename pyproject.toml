[project]
name = "polymarket-rbi-bot"
version = "0.1.0"
description = "Polymarket-native, passive market-making system (mm_v2)."
requires-python = ">=3.12"
# mm_v2 is stdlib-only so far (WS-A/B/C need no credentials and no client).
# Do NOT re-add a CLOB client until the §11 protocol-stack decision picks the
# v2 stack in M0 — the v1 py-clob-client is unsupported on CLOB V2 (PLAN §8/§11).
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["mm_v2/tests"]
python_files = ["test_*.py"]
